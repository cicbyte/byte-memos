<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="head">
    <span class="logo">✦</span>
    <span class="title">byte-memos 快记</span>
    <button id="openOptions" class="icon-btn" title="设置">⚙</button>
  </header>

  <div id="status" class="status checking">
    <span class="dot"></span><span id="statusText">检测连接…</span>
  </div>

  <textarea id="note" rows="5" placeholder="随手记点什么…（Ctrl+Enter 保存）"></textarea>

  <label class="attach">
    <input type="checkbox" id="attachPage" checked />
    附上当前页面链接
  </label>

  <div id="pageInfo" class="page-info" hidden>
    <span id="pageTitle"></span>
  </div>

  <button id="save" class="save">保存到 byte-memos</button>
  <div id="result" class="result" hidden></div>

  <script src="popup.js"></script>
</body>
</html>
