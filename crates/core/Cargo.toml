[package]
name = "byte-memos-core"
description = "byte-memos 核心库：笔记 CRUD、标签管理、附件存储、FTS5 搜索、MCP 工具实现（CLI/Desktop 共享）"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# MCP 服务器（CLI 和桌面端按需启用）
mcp = ["dep:rmcp", "dep:schemars", "dep:axum", "dep:tokio", "dep:tokio-util"]
# AI 能力（rig-core 统一 provider 层：流式补全/多提供商；桌面端启用，CLI 可不启）
ai = ["dep:rig-core", "dep:tokio", "dep:tokio-util", "dep:base64", "dep:windows", "dep:futures", "dep:reqwest"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
rusqlite.workspace = true
rand = "0.9"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
zip = "2"
toml = "0.8"
regex = "1"

# MCP（feature gate，启用 mcp feature 时才编译）
rmcp = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
axum = { version = "0.8", features = ["macros"], optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { version = "0.7", optional = true }

# AI（feature gate；rig-core 精确 pin——上游 0.x 破坏性变更频繁）
rig-core = { version = "=0.42.0", default-features = false, features = ["reqwest", "native-tls"], optional = true }
base64 = { version = "0.22", optional = true }
futures = { version = "0.3", default-features = false, features = ["std"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"], optional = true }
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"], optional = true }
